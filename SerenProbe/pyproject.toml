[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-probe"
dynamic = ["version"]
description = "RAG evaluation toolkit for Seren's memory architecture"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Chad Roesler" }]
keywords = ["llm", "memory", "eval", "rag", "seren"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    # The shared Seren core: token resolution, config/version helpers, the auth
    # middleware, the viewer baseplate.
    "seren-meninges>=2.2.0,<3",
    # Shared request logging.
    "seren-sinew>=1.0.0,<2",
]

[project.optional-dependencies]
corp = [
    # Corporate / intercepting-proxy support.
    "truststore>=0.9",
]
mcp = [
    # MCP server surface - FastMCP for connected models.
    #
    # THE <2 CAP IS LOAD-BEARING: mcp 2.0.0 REMOVED FastMCP outright.
    # `mcp.server.fastmcp` does not exist in 2.x; the server class is now
    # mcp.server.mcpserver.MCPServer with a different API. Last 1.x that
    # still carries FastMCP is 1.29.0, and seren_probe/mcp/server.py does
    # `from mcp.server.fastmcp import FastMCP`. Uncapped, a fresh
    # `pip install seren-probe[mcp]` resolves 2.0.0, the import fails, the
    # ImportError gate catches it exactly as designed, and Probe comes up in
    # HTTP-only mode with one log line - i.e. /mcp silently ceases to exist
    # and looks like the extra just wasn't installed. Cap it, don't hope.
    #
    # Lift the cap in the same commit that ports server.py to the MCPServer
    # API - across the whole family at once, since they're copies.
    "mcp>=1.0.0,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Kept as an EMPTY alias. Update checking is CORE in seren-meninges now, and
# meninges is already a core dependency of this service, so there is nothing
# left for this extra to install. The name stays because it appears in the
# Starwright installers (--updates), in docs, and in people's notes - and an
# unknown extra only earns a "does not provide the extra" warning that trains
# operators to ignore warnings.
updates = []

[project.scripts]
seren-probe = "seren_probe.__main__:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenProbe"
Repository = "https://github.com/ChadRoesler/SerenProbe"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenProbe/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["seren_probe*"]

# Ship the viewer UI files inside the wheel so GET /viewer works on an
# installed copy.
[tool.setuptools.package-data]
seren_probe = ["viewer/ui/*.html", "viewer/ui/*.css", "viewer/ui/*.js"]

[tool.setuptools_scm]
# .git is one level above pyproject.toml (repo root)
root = ".."
version_scheme = "release-branch-semver"
version_file = "seren_probe/_version.py"
# Strip the leading 'v' so "v1.2.3" → "1.2.3"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
# Used when no git tags exist (local dev, fresh clone). CI release builds
# override with SETUPTOOLS_SCM_PRETEND_VERSION.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
